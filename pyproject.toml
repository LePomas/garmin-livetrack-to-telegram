[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-livetrack-watcher"
version = "0.1.0"
description = "Forward Garmin LiveTrack email links to Telegram recipients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Garmin LiveTrack Watcher contributors" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
